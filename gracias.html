<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gracias por contactar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/landing.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark nav-custom">
    <div class="container">
      <a class="navbar-brand" href="landing.html#inicio">
        <img src="images/firma_lucia.png" alt="Lucía Tejedor" height="40">
      </a>
    </div>
  </nav>

  <header class="hero">
    <div id="particles-js"></div>
    <div class="container text-center">
      <h1 class="display-5 fw-bold mb-3">¡Gracias por contactar conmigo!</h1>
      <p class="lead mb-0">
        Tu mensaje ha sido enviado correctamente.
      </p>
    </div>
  </header>

  <main class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="panel text-center">
          <p class="mb-4">
            Gracias por tu interés en mi trabajo. Puedes volver a la página principal
            para seguir explorando mis proyectos, habilidades y experiencia.
          </p>

          <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-primary" href="landing.html">Volver al inicio</a>
            <a class="btn btn-outline-light" href="proyectos.html">Ver proyectos</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 footer-custom">
    <div class="container text-center">
      <p class="mb-0">© 2026 · Lucía Tejedor · Portfolio</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": {
          "value": 70, // Cantidad de nodos
          "density": { "enable": true, "value_area": 800 }
        },
        "color": { "value": ["#ed3a7c", "#22c55e", "#b8c7f0"] },
        "shape": { "type": "circle" },
        "opacity": {
          "value": 0.5,
          "random": false
        },
        "size": {
          "value": 3,
          "random": true
        },
        "line_linked": {
          "enable": true,
          "distance": 150,
          "color": "#b8c7f0",
          "opacity": 0.2,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 2,
          "direction": "none",
          "random": false,
          "straight": false,
          "out_mode": "out",
          "bounce": false
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": {
            "enable": true,
            "mode": "grab"
          },
          "onclick": {
            "enable": true,
            "mode": "push"
          },
          "resize": true
        },
        "modes": {
          "grab": { "distance": 140, "line_linked": { "opacity": 0.8 } },
          "push": { "particles_nb": 4 }
        }
      },
      "retina_detect": true
    });
  </script>

  <script src="https://unpkg.com/scrollreveal"></script>

  <script>
    const sr = ScrollReveal({
      distance: '60px',
      duration: 1000,   // Duración de la animación en milisegundos
      delay: 200,       // Retraso antes de empezar
      reset: false      // 'true', la animación se repite al subir y bajar. En 'false' solo se anima la primera vez.
    });
    
    // Títulos: Aparecen desde la izquierda
    sr.reveal('h2', { origin: 'left', delay: 150 });
    
    // Paneles de texto: Aparecen desde abajo
    sr.reveal('.panel', { origin: 'bottom', delay: 300 });
    
    // Tarjetas (Proyectos, Habilidades): Aparecen en cascada una tras otra
    sr.reveal('.card-custom', { origin: 'bottom', interval: 200 });
    
    // Imagen de perfil en el sobre mí: Aparece desde la derecha
    sr.reveal('.hero img', { origin: 'right', delay: 400 });
  </script>
  
</body>
</html>
